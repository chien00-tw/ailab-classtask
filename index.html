<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級任務進度牆 v2.8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Chakra+Petch:wght@700&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #060913;
      color: #f1f5f9;
      user-select: none;
      overflow-x: hidden;
    }

    .font-num {
      font-family: 'Chakra Petch', 'Noto Sans TC', monospace;
    }

    /* Custom Cyber Deck Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #090d1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    /* High-contrast Glassmorphism & Neon Cards */
    .glass-card {
      background: rgba(13, 20, 36, 0.94);
      border: 2px solid rgba(59, 130, 246, 0.28);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.65);
      box-shadow: 0 0 22px rgba(59, 130, 246, 0.28);
    }

    .glass-card-complete {
      background: rgba(6, 78, 59, 0.45) !important;
      border-color: #10b981 !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.35) !important;
    }

    .stat-pill {
      background: rgba(10, 16, 30, 0.95);
      border: 2px solid rgba(59, 130, 246, 0.45);
      backdrop-filter: blur(10px);
    }

    .editable-active {
      outline: 3px dashed #fbbf24 !important;
      outline-offset: 3px;
      cursor: text !important;
      background: rgba(245, 158, 11, 0.25) !important;
      border-radius: 6px;
    }

    /* Pseudo-fullscreen support for iframe restrictions */
    .pseudo-fullscreen-mode {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      background: #060913 !important;
      padding: 1.25rem !important;
      overflow-y: auto !important;
    }
  </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col justify-between p-3 lg:p-5 select-none bg-[#060913]">

  <!-- Top Navigation / Control Header -->
  <header class="glass-card rounded-2xl p-4 mb-3 flex flex-col md:flex-row items-center md:items-start xl:items-center justify-between gap-4 border-2 border-blue-600/30">
    <!-- Left Column: Title, Date & Icon Action Buttons -->
    <div class="flex flex-col items-center md:items-start gap-2.5 w-full md:w-auto">
      <!-- Main Title + Date + Pure Icon Buttons -->
      <div class="flex items-center gap-3 flex-wrap justify-center md:justify-start">
        <h1 class="text-2xl lg:text-3xl font-black tracking-wide text-white flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-blue-400"></i>
          <span>班級任務進度牆</span>
        </h1>
        <span class="bg-blue-900/80 text-blue-200 text-xs font-bold px-2.5 py-1 rounded-full border border-blue-500/50">v2.8</span>
        
        <!-- Current Date (Year / Month / Day) -->
        <div class="bg-slate-900 text-amber-300 text-sm font-bold px-3 py-1.5 rounded-xl border border-amber-500/40 flex items-center gap-1.5 shadow-md">
          <i class="fa-regular fa-calendar-days text-amber-400"></i>
          <span id="current-date-text">2026年08月29日</span>
        </div>

        <!-- Action Icon-Only Buttons (Positioned to the Right of Date) -->
        <div class="flex items-center gap-2 ml-1">
          <!-- Adjust Student Count Button -->
          <button onclick="openStudentCountModal()" title="調整班級人數" aria-label="調整班級人數"
            class="w-10 h-10 bg-indigo-950/90 hover:bg-indigo-800 text-indigo-200 active:scale-95 text-base font-bold rounded-xl border border-indigo-500/60 transition flex items-center justify-center shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <i class="fa-solid fa-users-gear"></i>
          </button>

          <!-- Fullscreen Toggle Button -->
          <button id="fullscreen-btn" onclick="toggleFullscreen()" title="全螢幕模式" aria-label="全螢幕模式"
            class="w-10 h-10 bg-blue-950/90 hover:bg-blue-800 text-blue-200 active:scale-95 text-base font-bold rounded-xl border border-blue-500/60 transition flex items-center justify-center shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400">
            <i id="fullscreen-icon" class="fa-solid fa-expand"></i>
          </button>
          
          <!-- Edit Mode Toggle Button -->
          <button id="edit-mode-btn" onclick="toggleEditMode()" title="編修模式" aria-label="編修模式"
            class="w-10 h-10 bg-amber-950/90 hover:bg-amber-800 text-amber-200 active:scale-95 text-base font-bold rounded-xl border border-amber-500/60 transition flex items-center justify-center shadow-md focus:outline-none focus:ring-2 focus:ring-amber-400">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          
          <!-- Reset Storage Button -->
          <button onclick="openResetModal()" title="清空作業紀錄" aria-label="清空作業紀錄"
            class="w-10 h-10 bg-rose-950/90 hover:bg-rose-800 text-rose-200 active:scale-95 text-base font-bold rounded-xl border border-rose-500/60 transition flex items-center justify-center shadow-md focus:outline-none focus:ring-2 focus:ring-rose-400">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Column: Big Completion Rate & Big Clock -->
    <div class="flex items-center justify-stretch sm:justify-end gap-3 w-full md:w-auto">
      <!-- Full Class Completion Rate -->
      <div class="stat-pill flex-1 sm:flex-initial px-5 py-2.5 rounded-2xl flex flex-col justify-center min-w-[170px] lg:min-w-[200px] border-blue-500/50">
        <div class="text-xs text-blue-300 font-bold flex items-center gap-1.5 justify-end">
          <i class="fa-solid fa-chart-line text-blue-400"></i> 全班完成率
        </div>
        <div class="text-3xl lg:text-5xl font-black text-blue-400 font-num tracking-tight flex items-baseline justify-end mt-0.5">
          <span id="class-rate-text">0</span>
          <span class="text-2xl font-bold text-blue-300 ml-1">%</span>
        </div>
      </div>

      <!-- Current Time Section -->
      <div class="stat-pill flex-1 sm:flex-initial px-6 py-2.5 rounded-2xl flex flex-col justify-center min-w-[170px] lg:min-w-[210px] border-amber-500/50">
        <div class="text-xs text-slate-300 font-bold flex items-center gap-1.5 justify-end">
          <i class="fa-regular fa-clock text-amber-400"></i> 目前時間
        </div>
        <div id="clock-display" class="text-3xl lg:text-5xl font-num font-black text-amber-300 tracking-wider text-right mt-0.5">
          16:13
        </div>
      </div>
    </div>
  </header>

  <!-- Main Grid Matrix Container -->
  <main class="flex-1 my-1">
    <!-- Top Edit Bar Controls (Only shown when Edit Mode is Active) -->
    <div id="edit-banner" class="hidden glass-card mb-3 p-3.5 rounded-xl border-amber-500/70 bg-amber-950/40 text-amber-200 text-sm flex flex-wrap items-center justify-between gap-3 shadow-lg">
      <div class="flex items-center gap-2 font-bold text-base">
        <i class="fa-solid fa-circle-exclamation text-amber-400 text-lg"></i>
        <span>編修模式已啟動：點擊各卡片座號或名稱可直接修改內容！</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="openStudentCountModal()" class="px-3.5 py-2 bg-indigo-600/50 hover:bg-indigo-600/70 text-indigo-100 font-bold text-xs rounded-xl border border-indigo-400/60 transition flex items-center gap-1.5">
          <i class="fa-solid fa-users-gear"></i> 批次設定人數 (<span id="banner-student-count">21</span>人)
        </button>
        <button onclick="addStudent()" class="px-3.5 py-2 bg-amber-500/30 hover:bg-amber-500/50 text-amber-100 font-bold text-xs rounded-xl border border-amber-400/60 transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-plus"></i> +1人
        </button>
        <button onclick="removeLastStudent()" class="px-3.5 py-2 bg-rose-500/30 hover:bg-rose-500/50 text-rose-100 font-bold text-xs rounded-xl border border-rose-400/60 transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-minus"></i> -1人
        </button>
      </div>
    </div>

    <!-- Dynamic Grid -->
    <div id="student-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3.5">
      <!-- Dynamically Rendered by JS -->
    </div>
  </main>

  <!-- Bottom Control Panel / Task Drawer -->
  <footer class="mt-3 glass-card rounded-2xl p-4 border-2 border-blue-900/50">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      
      <!-- Left: Today's Active Tasks -->
      <div class="lg:col-span-5 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-slate-800/90 pr-0 lg:pr-5 pb-4 lg:pb-0">
        <div>
          <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 class="text-base font-bold text-blue-300 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-blue-400"></i> 今日任務
            </h3>
            <div class="flex items-center gap-1.5">
              <button onclick="clearTodayTasks()" class="px-3 py-1.5 bg-rose-950/70 hover:bg-rose-900 text-rose-200 text-xs font-bold rounded-lg border border-rose-700/50 transition">
                清空今日清單
              </button>
              <button onclick="unselectAllTasks()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition">
                取消選取
              </button>
              <button onclick="selectAllTasks()" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white text-xs font-bold rounded-lg shadow-md transition">
                全部選取
              </button>
            </div>
          </div>

          <!-- Active Today's Task List Container -->
          <div id="today-tasks-container" class="flex flex-wrap gap-2 min-h-[52px] p-2.5 bg-slate-950/80 rounded-xl border border-slate-800 items-center">
            <!-- Rendered by JS -->
          </div>
        </div>

        <div id="empty-tasks-tip" class="text-xs text-slate-400 mt-2 font-medium italic flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-right text-blue-400"></i> 請點選右側資源庫，將作業加入今日任務...
        </div>
      </div>

      <!-- Right: Task Library Pool -->
      <div class="lg:col-span-7 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
              <i class="fa-solid fa-boxes-stacked text-blue-400"></i> 任務資源庫 <span class="text-xs font-normal text-slate-400">(點擊加入今日任務)</span>
            </h3>
            <!-- Add Custom Task Input -->
            <div class="flex items-center gap-1.5">
              <input id="custom-task-input" type="text" placeholder="新增自訂作業..." 
                     class="bg-slate-900 text-xs border border-slate-600 text-slate-100 px-3 py-1.5 rounded-lg focus:outline-none focus:border-blue-400 w-32 sm:w-44 placeholder-slate-500"
                     onkeydown="if(event.key==='Enter') addCustomTask()">
              <button onclick="addCustomTask()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-bold rounded-lg transition shadow">
                + 新增
              </button>
            </div>
          </div>

          <!-- Preset Task Buttons with Large Touch Area -->
          <div id="preset-library-container" class="flex flex-wrap gap-2.5 max-h-[120px] overflow-y-auto pr-1">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>

    </div>
  </footer>

  <!-- Page Bottom Center Subtitle Credit -->
  <div class="w-full text-center py-2.5 mt-2">
    <div class="inline-flex items-center justify-center gap-2.5 px-4 py-1.5 rounded-full bg-slate-900/80 border border-slate-800/80 text-xs sm:text-sm font-semibold tracking-wider text-slate-400 shadow-inner">
      <span class="text-blue-400 font-bold">班級百寶箱</span>
      <span class="text-slate-600">|</span>
      <span class="text-cyan-300 font-bold">互動學習系統</span>
      <span class="text-slate-600">|</span>
      <span class="text-emerald-300 font-bold">教材設計：S.C. Kuo</span>
    </div>
  </div>

  <!-- Adjust Student Count Modal -->
  <div id="student-count-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 rounded-2xl border-2 border-indigo-500/50 shadow-2xl">
      <div class="flex items-center gap-3 text-indigo-400 mb-3">
        <i class="fa-solid fa-users-gear text-3xl"></i>
        <h2 class="text-xl font-bold text-white">調整班級人數</h2>
      </div>
      <p class="text-sm text-slate-300 mb-4 leading-relaxed">
        可直接輸入班級座號總人數，或點選下方常用班級規模快速套用：
      </p>

      <!-- Quick Preset Buttons (20 ~ 26 人) -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="setQuickCount(20)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">20 人</button>
        <button onclick="setQuickCount(21)" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-bold rounded-lg border border-indigo-500 transition shadow-sm">21 人 (預設)</button>
        <button onclick="setQuickCount(22)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">22 人</button>
        <button onclick="setQuickCount(23)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">23 人</button>
        <button onclick="setQuickCount(24)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">24 人</button>
        <button onclick="setQuickCount(25)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">25 人</button>
        <button onclick="setQuickCount(26)" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition">26 人</button>
      </div>

      <!-- Numeric Input -->
      <div class="flex items-center gap-3 mb-6">
        <label for="student-count-input" class="text-sm font-bold text-slate-200 whitespace-nowrap">自訂人數 (1~50)：</label>
        <input id="student-count-input" type="number" min="1" max="50" value="21"
               class="bg-slate-900 border-2 border-indigo-500/60 text-indigo-200 font-num font-bold text-lg px-4 py-2 rounded-xl focus:outline-none focus:border-indigo-400 w-28 text-center">
      </div>

      <div class="flex justify-end gap-3">
        <button onclick="closeStudentCountModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl transition">
          取消
        </button>
        <button onclick="applyStudentCount()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-900/50 transition">
          確認變更
        </button>
      </div>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div id="reset-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 rounded-2xl border-2 border-rose-500/50 shadow-2xl">
      <div class="flex items-center gap-3 text-rose-400 mb-3">
        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        <h2 class="text-xl font-bold text-white">清空作業紀錄？</h2>
      </div>
      <p id="reset-modal-desc" class="text-sm text-slate-300 mb-6 leading-relaxed">
        這將重設全班所有座號的作業勾選狀態。建議在新的一天或新的一週開始時使用。
      </p>
      <div class="flex justify-end gap-3">
        <button onclick="closeResetModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl transition">
          取消
        </button>
        <button onclick="confirmResetAll()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-900/50 transition">
          確定清空
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Capsule -->
  <div id="toast-message" class="fixed bottom-6 right-6 bg-blue-600 text-white text-sm font-bold px-4 py-3 rounded-xl shadow-2xl border border-blue-400/50 transition-all duration-300 opacity-0 transform translate-y-4 pointer-events-none z-50 flex items-center gap-2.5">
    <i class="fa-solid fa-circle-check text-blue-200"></i>
    <span id="toast-text">系統訊息</span>
  </div>

  <script>
    // System State Management (v2.8 Architecture)
    const DEFAULT_STUDENT_COUNT = 21;
    
    const defaultPresetTasks = [
      "圈詞", "數習", "作文", "甲本", "乙本", "學習單", 
      "聯絡簿", "通知單回條", "國語練習單", "數學練習單", 
      "生活札記", "數重本", "考卷訂正", "閱讀心得"
    ];

    let state = {
      version: "v2.8",
      isEditMode: false,
      totalStudents: DEFAULT_STUDENT_COUNT,
      presetTasks: [...defaultPresetTasks],
      todayTasks: [], // Array of string task names
      students: []    // Array of { id, number, name, completedTasks }
    };

    // System Startup Initializer
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      initClock();
      renderAll();
    });

    // Real-time Clock & Date Timer (HH:mm & YYYY年MM月DD日)
    function initClock() {
      const updateClock = () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');

        const clockEl = document.getElementById('clock-display');
        if (clockEl) clockEl.textContent = `${hrs}:${mins}`;
        
        const dateEl = document.getElementById('current-date-text');
        if (dateEl) dateEl.textContent = `${year}年${month}月${day}日`;
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    // Load State from LocalStorage
    function loadState() {
      const saved = localStorage.getItem('classTaskState_v2.8');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.students) && parsed.students.length > 0) {
            state = parsed;
            state.isEditMode = false;
            // Clean legacy "學生" string if any
            state.students.forEach(s => {
              if (s.name && s.name.includes("學生")) {
                s.name = s.name.replace(/學生\s*/g, '');
              }
            });
            state.totalStudents = state.students.length;
            return;
          }
        } catch (e) {
          console.warn('Could not parse saved state, rebuilding defaults.', e);
        }
      }
      
      // Default Initializer for 21 Seat Numbers
      generateDefaultStudents(DEFAULT_STUDENT_COUNT);
      saveState();
    }

    function generateDefaultStudents(count) {
      state.totalStudents = count;
      state.students = Array.from({ length: count }, (_, i) => ({
        id: i + 1,
        number: String(i + 1).padStart(2, '0'),
        name: `${i + 1}號`,
        completedTasks: []
      }));
    }

    function saveState() {
      try {
        localStorage.setItem('classTaskState_v2.8', JSON.stringify(state));
      } catch (e) {
        console.error('LocalStorage save failed:', e);
      }
    }

    // Master Render Function
    function renderAll() {
      renderStudentGrid();
      renderTodayTasks();
      renderPresetLibrary();
      updateProgressMetrics();
      updateEditBanner();
    }

    function renderStudentGrid() {
      const grid = document.getElementById('student-grid');
      grid.innerHTML = '';

      state.students.forEach((student, index) => {
        const totalToday = state.todayTasks.length;
        const completedCount = student.completedTasks.filter(t => state.todayTasks.includes(t)).length;
        const rate = totalToday > 0 ? Math.round((completedCount / totalToday) * 100) : 0;
        const isAllDone = totalToday > 0 && rate === 100;

        const card = document.createElement('div');
        card.className = `glass-card rounded-2xl p-3.5 flex flex-col justify-between transition-all duration-300 relative ${isAllDone ? 'glass-card-complete' : ''}`;
        
        let tasksHtml = '';
        if (totalToday === 0) {
          tasksHtml = `<div class="text-xs text-slate-500 font-bold my-3 text-center py-2.5 bg-slate-900/60 rounded-xl border border-slate-800">待機中</div>`;
        } else {
          tasksHtml = `<div class="flex flex-wrap gap-1.5 my-2.5">`;
          state.todayTasks.forEach(taskName => {
            const isDone = student.completedTasks.includes(taskName);
            tasksHtml += `
              <button onclick="toggleStudentTask(${student.id}, '${taskName}')" 
                class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 active:scale-95 ${
                  isDone 
                    ? 'bg-emerald-500 text-slate-950 font-black shadow-md shadow-emerald-900/50' 
                    : 'bg-slate-800/90 text-slate-300 hover:bg-slate-700 border border-slate-700'
                }">
                <i class="fa-solid ${isDone ? 'fa-check-double text-slate-950' : 'fa-square text-slate-500'} text-[10px]"></i>
                <span>${taskName}</span>
              </button>
            `;
          });
          tasksHtml += `</div>`;
        }

        const editableClass = state.isEditMode ? 'editable-active' : '';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-1.5 border-b border-slate-800/80">
              <span class="font-num text-sm font-black text-slate-400 ${editableClass}" 
                    data-field="number" data-index="${index}" 
                    contenteditable="${state.isEditMode}" 
                    onblur="updateStudentText(event, ${index}, 'number')">${student.number}</span>
              
              <span class="text-sm font-black ${isAllDone ? 'text-emerald-400' : 'text-blue-400'} font-num">
                ${rate}%
              </span>
            </div>

            <div class="mt-2 mb-1 font-bold text-base text-slate-100 truncate ${editableClass}"
                 data-field="name" data-index="${index}" 
                 contenteditable="${state.isEditMode}" 
                 onblur="updateStudentText(event, ${index}, 'name')">
              ${student.name}
            </div>

            ${tasksHtml}
          </div>

          <!-- Individual Progress Bar -->
          <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden mt-1 border border-slate-800">
            <div class="h-full transition-all duration-300 ${isAllDone ? 'bg-emerald-400 shadow-sm shadow-emerald-400' : 'bg-blue-500'}" style="width: ${rate}%"></div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function renderTodayTasks() {
      const container = document.getElementById('today-tasks-container');
      const emptyTip = document.getElementById('empty-tasks-tip');
      container.innerHTML = '';

      if (state.todayTasks.length === 0) {
        if (emptyTip) emptyTip.classList.remove('hidden');
        return;
      }

      if (emptyTip) emptyTip.classList.add('hidden');

      state.todayTasks.forEach(taskName => {
        const pill = document.createElement('div');
        pill.className = 'bg-blue-600/40 border-2 border-blue-500 text-blue-100 px-3 py-1.5 rounded-xl text-xs font-black flex items-center gap-2 shadow-sm';
        pill.innerHTML = `
          <span>+ ${taskName}</span>
          <button onclick="removeTodayTask('${taskName}')" title="移除任務" class="text-blue-200 hover:text-rose-400 transition ml-1 p-0.5">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        `;
        container.appendChild(pill);
      });
    }

    function renderPresetLibrary() {
      const container = document.getElementById('preset-library-container');
      container.innerHTML = '';

      state.presetTasks.forEach(taskName => {
        const isAdded = state.todayTasks.includes(taskName);
        const btn = document.createElement('button');
        btn.onclick = () => addTodayTask(taskName);
        btn.disabled = isAdded;
        btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold transition border-2 flex items-center gap-1.5 active:scale-95 ${
          isAdded
            ? 'bg-slate-900/60 text-slate-600 border-slate-800 cursor-not-allowed opacity-40'
            : 'bg-slate-800 hover:bg-blue-900/60 text-slate-200 hover:text-blue-100 border-slate-700 hover:border-blue-400 shadow-sm'
        }`;
        btn.innerHTML = `<span>+ ${taskName}</span>`;
        container.appendChild(btn);
      });
    }

    function toggleStudentTask(studentId, taskName) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return;

      const idx = student.completedTasks.indexOf(taskName);
      if (idx > -1) {
        student.completedTasks.splice(idx, 1);
      } else {
        student.completedTasks.push(taskName);
      }

      saveState();
      renderStudentGrid();
      updateProgressMetrics();
    }

    function addTodayTask(taskName) {
      if (!taskName || state.todayTasks.includes(taskName)) return;
      state.todayTasks.push(taskName);
      saveState();
      renderAll();
      showToast(`已將「${taskName}」加入今日任務`);
    }

    function removeTodayTask(taskName) {
      state.todayTasks = state.todayTasks.filter(t => t !== taskName);
      saveState();
      renderAll();
      showToast(`已自今日任務移除「${taskName}」`);
    }

    function addCustomTask() {
      const input = document.getElementById('custom-task-input');
      const value = input.value.trim();
      if (!value) return;

      if (!state.presetTasks.includes(value)) {
        state.presetTasks.push(value);
      }
      addTodayTask(value);
      input.value = '';
    }

    function selectAllTasks() {
      if (state.todayTasks.length === 0) {
        showToast("請先將作業加入今日任務！");
        return;
      }
      state.students.forEach(s => {
        s.completedTasks = [...state.todayTasks];
      });
      saveState();
      renderAll();
      showToast("已將全班所有座號標記為完成！");
    }

    function unselectAllTasks() {
      state.students.forEach(s => {
        s.completedTasks = [];
      });
      saveState();
      renderAll();
      showToast("已清空所有勾選！");
    }

    function clearTodayTasks() {
      state.todayTasks = [];
      state.students.forEach(s => {
        s.completedTasks = [];
      });
      saveState();
      renderAll();
      showToast("已清空今日任務清單");
    }

    // Progress Metric Calculation
    function updateProgressMetrics() {
      const totalStudents = state.students.length;
      const totalTodayTasks = state.todayTasks.length;

      if (totalStudents === 0 || totalTodayTasks === 0) {
        setRateDisplay(0);
        return;
      }

      let totalCompletedPoints = 0;
      state.students.forEach(s => {
        const count = s.completedTasks.filter(t => state.todayTasks.includes(t)).length;
        totalCompletedPoints += count;
      });

      const maxPossiblePoints = totalStudents * totalTodayTasks;
      const overallRate = Math.round((totalCompletedPoints / maxPossiblePoints) * 100);

      setRateDisplay(overallRate);
    }

    function setRateDisplay(rate) {
      const el = document.getElementById('class-rate-text');
      if (el) el.textContent = rate;
    }

    function toggleEditMode() {
      state.isEditMode = !state.isEditMode;
      const btn = document.getElementById('edit-mode-btn');
      
      if (state.isEditMode) {
        btn.classList.remove('bg-amber-950/90', 'text-amber-200');
        btn.classList.add('bg-amber-500', 'text-slate-950', 'ring-2', 'ring-amber-300');
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i>`;
        showToast("已開啟編修模式！點擊座號或姓名可直接修改");
      } else {
        btn.classList.add('bg-amber-950/90', 'text-amber-200');
        btn.classList.remove('bg-amber-500', 'text-slate-950', 'ring-2', 'ring-amber-300');
        btn.innerHTML = `<i class="fa-solid fa-pen-to-square"></i>`;
        saveState();
        showToast("已儲存編修結果！");
      }

      renderAll();
    }

    function updateEditBanner() {
      const banner = document.getElementById('edit-banner');
      const countEl = document.getElementById('banner-student-count');
      if (countEl) countEl.textContent = state.students.length;
      if (!banner) return;
      if (state.isEditMode) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function updateStudentText(event, index, field) {
      if (!state.isEditMode) return;
      let text = event.target.innerText.trim();
      text = text.replace(/學生\s*/g, '');

      if (state.students[index]) {
        if (text === '') {
          event.target.innerText = field === 'number' ? String(index + 1).padStart(2, '0') : `${index + 1}號`;
          state.students[index][field] = event.target.innerText;
        } else {
          event.target.innerText = text;
          state.students[index][field] = text;
        }
        saveState();
      }
    }

    // Dynamic Student Count Adjustment Functions
    function openStudentCountModal() {
      const input = document.getElementById('student-count-input');
      if (input) input.value = state.students.length;
      document.getElementById('student-count-modal').classList.remove('hidden');
    }

    function closeStudentCountModal() {
      document.getElementById('student-count-modal').classList.add('hidden');
    }

    function setQuickCount(val) {
      const input = document.getElementById('student-count-input');
      if (input) input.value = val;
    }

    function applyStudentCount() {
      const input = document.getElementById('student-count-input');
      const targetCount = parseInt(input.value, 10);

      if (isNaN(targetCount) || targetCount < 1 || targetCount > 50) {
        showToast("請輸入 1 至 50 之間的有效人數！");
        return;
      }

      adjustStudentCount(targetCount);
      closeStudentCountModal();
    }

    function adjustStudentCount(targetCount) {
      const currentCount = state.students.length;

      if (targetCount === currentCount) {
        showToast(`班級人數已為 ${targetCount} 人`);
        return;
      }

      if (targetCount > currentCount) {
        // Add additional students
        for (let i = currentCount + 1; i <= targetCount; i++) {
          state.students.push({
            id: Date.now() + i,
            number: String(i).padStart(2, '0'),
            name: `${i}號`,
            completedTasks: []
          });
        }
      } else {
        // Trim down to target count
        state.students = state.students.slice(0, targetCount);
      }

      state.totalStudents = targetCount;
      saveState();
      renderAll();
      showToast(`已成功將班級人數調整為 ${targetCount} 人`);
    }

    function addStudent() {
      const newId = state.students.length + 1;
      if (newId > 50) {
        showToast("已達人數上限 (50人)！");
        return;
      }
      state.students.push({
        id: Date.now(),
        number: String(newId).padStart(2, '0'),
        name: `${newId}號`,
        completedTasks: []
      });
      state.totalStudents = state.students.length;
      saveState();
      renderAll();
      showToast(`已新增座號 ${newId}號`);
    }

    function removeLastStudent() {
      if (state.students.length <= 1) {
        showToast("至少需保留一個座號！");
        return;
      }
      const removed = state.students.pop();
      state.totalStudents = state.students.length;
      saveState();
      renderAll();
      showToast(`已移除最後一位 (${removed.name})`);
    }

    function openResetModal() {
      const desc = document.getElementById('reset-modal-desc');
      if (desc) {
        desc.textContent = `這將清空全班 ${state.students.length} 位座號所有作業紀錄。建議在新的一天開始時使用。`;
      }
      document.getElementById('reset-modal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('reset-modal').classList.add('hidden');
    }

    function confirmResetAll() {
      state.todayTasks = [];
      generateDefaultStudents(state.totalStudents || DEFAULT_STUDENT_COUNT);
      saveState();
      closeResetModal();
      renderAll();
      showToast("作業紀錄與任務狀態已完全重設");
    }

    function toggleFullscreen() {
      const body = document.getElementById('app-body');
      const icon = document.getElementById('fullscreen-icon');

      if (!document.fullscreenElement && !body.classList.contains('pseudo-fullscreen-mode')) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().then(() => {
            if (icon) icon.className = "fa-solid fa-compress";
          }).catch(() => {
            body.classList.add('pseudo-fullscreen-mode');
            if (icon) icon.className = "fa-solid fa-compress";
            showToast("已切換至全螢幕模式");
          });
        } else {
          body.classList.add('pseudo-fullscreen-mode');
          if (icon) icon.className = "fa-solid fa-compress";
          showToast("已切換至全螢幕模式");
        }
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            if (icon) icon.className = "fa-solid fa-expand";
          }).catch(() => {});
        }
        body.classList.remove('pseudo-fullscreen-mode');
        if (icon) icon.className = "fa-solid fa-expand";
        showToast("已結束全螢幕模式");
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (icon) {
        icon.className = document.fullscreenElement ? "fa-solid fa-compress" : "fa-solid fa-expand";
      }
    });

    // Non-blocking Toast Notification
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast-message');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;
      text.textContent = msg;

      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 2400);
    }
  </script>
</body>
</html>
